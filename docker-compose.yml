version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bhusetu_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./bhusetu.db
      - MOCK_OCR_MODE=true
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-bhusetu-super-secret-key-change-in-prod}
      - ENVIRONMENT=production
    volumes:
      - bhusetu_data:/app/data
      - bhusetu_db:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bhusetu_frontend
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bhusetu_data:
  bhusetu_db:
