<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" style="background:#ffffff; font-family:sans-serif;">
  <rect width="640" height="480" fill="#f8fafc"/>
  <text x="320.0" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">BhuSetu Reliability Calibration Curve (Isotonic Regression)</text>
  
  <!-- Grid -->
  <line x1="60" y1="420" x2="580" y2="420" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="60" y1="60" x2="60" y2="420" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="60" y1="240.0" x2="580" y2="240.0" stroke="#e2e8f0" stroke-dasharray="4"/>
  <line x1="320.0" y1="60" x2="320.0" y2="420" stroke="#e2e8f0" stroke-dasharray="4"/>

  <!-- Diagonal Perfect Calibration -->
  <polyline points="60,420 580,60" fill="none" stroke="#94a3b8" stroke-dasharray="6" stroke-width="2"/>
  
  <!-- Calibrated Curve -->
  <polyline points="270.8,400.0 290.7,392.4 301.8,387.1 321.5,375.3 329.0,370.0 341.5,359.9 345.2,356.6 367.2,334.3 375.1,325.0 386.7,310.4 412.9,273.1 422.2,258.9 433.5,241.4 442.4,227.6 462.0,197.8 471.6,184.0 489.6,159.9 501.7,145.6 516.5,130.0 527.4,120.0 532.1,116.1 539.0,110.6 543.7,107.2 558.1,97.9 566.1,93.4" fill="none" stroke="#16a34a" stroke-width="3.5"/>

  <!-- Threshold line -->
  <line x1="528.0" y1="60" x2="528.0" y2="420" stroke="#dc2626" stroke-dasharray="4" stroke-width="2"/>
  <text x="533.0" y="80" font-size="12" fill="#dc2626" font-weight="bold">Auto-Accept (&gt;=0.9)</text>

  <!-- Labels -->
  <text x="320.0" y="465" text-anchor="middle" font-size="14" fill="#334155">Predicted Field Confidence Score</text>
  <text x="20" y="240.0" text-anchor="middle" font-size="14" fill="#334155" transform="rotate(-90 20 240.0)">Empirical Accuracy / Precision</text>

  <!-- Legend -->
  <rect x="420" y="60" width="150" height="65" fill="#ffffff" stroke="#e2e8f0" rx="4"/>
  <line x1="430" y1="80" x2="460" y2="80" stroke="#94a3b8" stroke-dasharray="4" stroke-width="2"/>
  <text x="470" y="84" font-size="11" fill="#475569">Perfect Calibration</text>
  <line x1="430" y1="105" x2="460" y2="105" stroke="#16a34a" stroke-width="3"/>
  <text x="470" y="109" font-size="11" fill="#16a34a" font-weight="bold">BhuSetu Calibrated</text>
</svg>